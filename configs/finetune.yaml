implementation:
  version: "3.1.0"
  score_schema_version: 1
release:
  version: "1.0.1"
  manifest_schema_version: 2
  archive_schema_version: 2
  ref: phase3-v1.0.1
  kaggle_python_version: "3.12.13"
  environment_lock: requirements/kaggle.lock
  license_file: LICENSE
  notice_file: NOTICE
base_model:
  id: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
  revision: 1427fd652930e4ba29e8149678df786c240d8825
  tokenizer_revision: 1427fd652930e4ba29e8149678df786c240d8825
input:
  max_length: 320
  truncation: only_second
  title_separator: "\n"
  pair_order: query_document
split:
  seed: 20260803
  validation_fraction: 0.15
  stratify_by: relevant_bucket_x_has_judged_negative
  relevant_buckets: [0, 1, 2, "3+"]
  min_stratum_size: 20
negatives:
  weak_rank_min: 26
  weak_rank_max: 100
  bucket_boundaries: [[26, 50], [51, 75], [76, 100]]
  bucket_targets: [3, 3, 2]
  max_weak_negatives_per_query: 8
  weak_negative_weight: 0.5
  judged_negative_weight: 1.0
  max_judged_pairs_per_query: 8
  max_weak_pairs_per_query: 8
  max_pairs_per_query: 16
  spare_slot_priority: judged_first
  resample_per_epoch: false
loss:
  id: pairwise_logistic
  aggregation: query_weighted_mean_then_window_mean
training:
  epochs: 3
  micro_batch_queries: 1
  grad_accumulation: 16
  max_sequences_per_microbatch: 40
  weight_decay: 0.01
  no_decay_patterns: ["bias", "LayerNorm.weight"]
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  precision: fp32
  seed: 20260803
  num_workers: 0
  device: cuda
  token_cache: pretokenized_flat_int32
  minimum_free_ram_gib: 4
runs:
  C1:
    kind: shuffled_control
    regime: control_c1
    learning_rate: 2.0e-5
    epochs: 1
    target_pairs: 2000
    control_seed: 20260805
    shuffle_seed: 20260804
  A1:
    kind: full
    regime: judged_only
    learning_rate: 7.0e-6
    epochs: 3
  A2:
    kind: full
    regime: judged_only
    learning_rate: 2.0e-5
    epochs: 3
  B1:
    kind: full
    regime: weak_negatives
    learning_rate_from: best_judged_run
    epochs: 3
validation:
  metric: ndcg_at_10
  include_queries_without_relevant: true
  cross_check_with_trec_eval_once: true
  tolerance: 0.0001
selection:
  candidates_include_zero_shot: true
  epoch_tie_break: earliest
  run_tie_break_order: [A1, A2, B1]
  production_tie_prefers_zero_shot: true
  ab_bootstrap_resamples: 10000
  ab_bootstrap_seed: 20260803
  ab_analysis_role: exploratory_post_selection
control:
  c1_bootstrap_resamples: 10000
  c1_bootstrap_seed: 20260803
  c1_blocking_rule: ci_lower_bound_above_zero
evaluation:
  minimum_practically_relevant_delta: 0.010
  zero_tolerance: 1.0e-12
  bootstrap_resamples: 10000
  bootstrap_seed: 20260802
  bootstrap_confidence: 0.95
  reference_zero_shot_ndcg_at_10: 0.5365
  reference_bm25_ndcg_at_10: 0.3342
inference:
  batch_size: 64
  cpu_batch_size: 16
  device: auto
  cuda_dtype: float16
  score_dtype: float32
  shard_queries: 64
protocol:
  official_depth: 100
  internal_tie_break: raw_score_desc_then_docid_asc
  trec_score_encoding: rank_preserving
  trec_score_base: 1000000
  trec_score_format: "%.4f"
inputs:
  train_candidates: artifacts/candidates/train_top100.parquet
  queries: artifacts/candidates/queries.parquet
  passages: artifacts/candidates/passages.parquet
  train_qrels: artifacts/raw/miracl-ru/qrels.miracl-v1.0-ru-train.tsv
  phase1_manifest: reports/audit/candidate_cache_manifest.json
  phase2_manifest: reports/audit/rerank_manifest.json
dev_inputs:
  dev_candidates: artifacts/candidates/dev_top100.parquet
  dev_qrels: artifacts/raw/miracl-ru/qrels.miracl-v1.0-ru-dev.tsv
  bm25_run: artifacts/runs/dev_bm25_top100.trec
  zeroshot_run: artifacts/runs/dev_rerank_zeroshot_k100.trec
  zeroshot_scores: artifacts/scores/dev_zeroshot_mminilmv2l12.parquet
  zeroshot_metrics: reports/metrics/dev_zeroshot_mminilmv2l12.json
  bm25_metrics: reports/metrics/dev_bm25_baseline.json
artifacts:
  query_split: artifacts/training/query_split.parquet
  validation_groups: artifacts/training/validation_groups.parquet
  pairs_judged_only: artifacts/training/pairs_judged_only.parquet
  pairs_weak_negatives: artifacts/training/pairs_weak_negatives.parquet
  pairs_control_c1: artifacts/training/pairs_control_c1.parquet
  models_dir: artifacts/models
  best_finetuned_dir: artifacts/models/best_finetuned
  finetuned_scores: artifacts/scores/dev_finetuned.parquet
  finetuned_run: artifacts/runs/dev_rerank_finetuned_k100.trec
audits:
  query_split_manifest: reports/audit/query_split_manifest.json
  pairs_manifest: reports/audit/pairs_manifest.json
  checkpoint_selection: reports/audit/checkpoint_selection.json
  dev_access_ledger: reports/audit/dev_access_ledger.jsonl
  finetune_smoke: reports/audit/finetune_smoke.json
  training_manifest: reports/audit/training_manifest.json
  protocol_snapshot: reports/audit/finetune_protocol.yaml
  model_card: reports/audit/model_card.md
  control_report: reports/audit/control_c1.json
  resource_report: reports/audit/resource_report.json
  environment_freeze: reports/audit/environment_freeze.txt
metrics:
  training_history_template: reports/training/{run_id}_history.json
  validation_checkpoint_metrics: reports/metrics/validation_checkpoint_metrics.json
  validation_ab_comparison: reports/metrics/validation_ab_comparison.json
  finetuned: reports/metrics/dev_finetuned.json
  three_way: reports/metrics/dev_three_way_comparison.json
  tie_diagnostic: reports/metrics/dev_score_tie_diagnostic.json
archive:
  results_zip: artifacts/rusearchrank_phase3_results_v1.0.1.zip
  model_zip_template: artifacts/rusearchrank_phase3_model_{run_id}_v1.0.1.zip
paths:
  repository_root: ..
  work_dir: artifacts/work/phase3
