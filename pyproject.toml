[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rusearchrank"
version = "1.0.1"
description = "Воспроизводимый поиск BM25 и reranking для русскоязычной части MIRACL"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    # Корпус MIRACL читается из статических сегментов JSONL.GZ в зафиксированной
    # ревизии, поэтому ключевая зависимость здесь — huggingface-hub, а не datasets.
    # Для get_paths_info требуется версия >=0.23; используемый API стабилен в 0.x и 1.x.
    "huggingface-hub>=0.24,<2.0",
    "pyarrow>=17,<26",
    "pandas>=2.2,<4.0",
    "numpy>=1.26,<3.0",
    "PyYAML>=6.0,<7.0",
    # datasets нужен последующим этапам; код этапа 1 его не импортирует.
    "datasets>=4.0,<6.0",
    "transformers>=4.41,<6.0",
    "sentence-transformers>=4.0,<6.0",
    "torch>=2.4,<3.0",
    "pytest>=8.0,<10.0",
]

[project.optional-dependencies]
retrieval = ["pyserini==2.3.0"]

[project.scripts]
rusearchrank = "rusearchrank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
