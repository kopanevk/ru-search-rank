name: Проверки

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Установить проект
        run: python -m pip install -e .
      - name: Запустить pytest
        run: python -m pytest -q
      - name: Проверить notebook этапа 3
        run: python scripts/validate_phase3_notebook.py
      - name: Проверить синтаксис пакета
        run: python -m compileall -q src
